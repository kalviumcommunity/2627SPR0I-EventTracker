services:
  postgres:
    image: postgres:17
    container_name: eventtracker-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: eventtracker_user
      POSTGRES_PASSWORD: eventtracker_dev_password
      POSTGRES_DB: eventtracker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
